# Top-down Scope configuration — Highest Level
# 
# The highest level consists of top-level Scopes with kind: "domain".
# These represent the primary Industries being researched.
#
# Per user specification:
# - Space Industry
# - Autonomous AI Industry
# - AI Models and Infrastructure Industry
# - Crypto Industry
# (L1s consolidated, CeFi+Regulation merged, Mining into Network Security)
#
# These are the L0 root nodes in the graph (shown on Home / All Industries).
# Sub-scopes (areas, themes, etc.) are children via PARENT_OF edges.
# Knowledge (Entities) attaches flexibly via MEMBER_OF edges.

discovery:
  # Global discovery settings (override per industry/scope if needed)
  enabled: true
  default_model: "grok-3"
  default_temperature: 0.1
  max_results_per_query: 15
  min_confidence: 0.65
  refresh_cron: "0 */4 * * *"   # every 4 hours
  use_real_search: true
  search_provider: "xai"
  persist_to: "data/graph.json"
  # Per-aspect query templates can be overridden per scope below
  # search_queries are defined per top-level scope for now

top_level_scopes:
  - stable_key: space-industry
    name: "Space Industry"
    kind: domain
    description: "Launch vehicles, satellites, space exploration, and supporting infrastructure"
    default_aspects:
      - companies
      - capabilities
      - technology
      - products
      - events
    search_queries:  # per-aspect discovery templates (used by discovery pipeline)
      - aspect: companies
        query: "major companies and organizations active in {scope_name} space industry 2024 2025"
      - aspect: technology
        query: "recent technology developments advancements in {scope_name} space"
      - aspect: capabilities
        query: "new capabilities performance milestones in {scope_name} space industry"
      - aspect: products
        query: "new products systems launches in {scope_name} space"
      - aspect: events
        query: "recent events milestones news in {scope_name} space industry 2024 2025"
    discovery:
      enabled: true
      refresh_cron: "0 */6 * * *"   # every 6 hours
      max_results_per_query: 10
      min_confidence: 0.7
      model: "grok-3"               # or grok-4
      temperature: 0.1
    children:
      - stable_key: launch-capabilities
        name: "Launch Capabilities"
        kind: sub_domain
        description: "Rockets, vehicles, and systems to reach and operate in space"
        children:
          - stable_key: reusable-launch
            name: "Reusable Launch Vehicles"
            kind: area
            description: "Falcon-class boosters, first-stage recovery, rapid reuse"
          - stable_key: heavy-lift
            name: "Heavy-Lift Launch Vehicles"
            kind: area
            description: "Starship, SLS, and next-generation super-heavy lift"
          - stable_key: small-launch
            name: "SmallSat & Rideshare Launch"
            kind: area
            description: "Dedicated small launchers and rideshare services"
          - stable_key: reusability
            name: "Booster Reusability & Recovery"
            kind: area
            description: "Landing legs, recovery vessels, refurbishment, turnaround"
      - stable_key: satellite-systems
        name: "Satellite Systems & Constellations"
        kind: sub_domain
        description: "On-orbit platforms, constellations, and space infrastructure"
        children:
          - stable_key: broadband-constellations
            name: "Broadband LEO Constellations"
            kind: area
            description: "Starlink, OneWeb, Kuiper — global broadband"
          - stable_key: earth-observation
            name: "Earth Observation & Remote Sensing"
            kind: area
            description: "Optical, SAR, hyperspectral, climate, and ISR"
          - stable_key: pnt-navigation
            name: "Navigation, Timing & Communications"
            kind: area
            description: "PNT, satcom, and data relay"
          - stable_key: in-orbit-services
            name: "In-Orbit Servicing & Manufacturing"
            kind: area
            description: "Refueling, repair, assembly, debris removal, ISRU"
      - stable_key: propulsion
        name: "Propulsion & Power"
        kind: sub_domain
        description: "Engines and power systems for launch and in-space use"
        children:
          - stable_key: chemical-propulsion
            name: "Chemical Propulsion"
            kind: area
          - stable_key: electric-propulsion
            name: "Electric & Ion Propulsion"
            kind: area
          - stable_key: advanced-propulsion
            name: "Advanced & Nuclear Propulsion"
            kind: area
      - stable_key: space-hardened-hardware
        name: "Space Hardened Hardware"
        kind: sub_domain
        description: "Radiation-hardened and space-qualified electronics, power systems, and components"
        children:
          - stable_key: chips-circuits
            name: "Chips and Circuits"
            kind: area
            description: "Radiation-hardened processors, memory, FPGAs, and integrated circuits"
          - stable_key: solar-panels
            name: "Solar Panels"
            kind: area
            description: "Space-grade solar arrays and photovoltaic systems"
          - stable_key: other-hardware
            name: "Other Hardware"
            kind: area
            description: "Batteries, sensors, actuators, connectors, and other space-qualified components"
      - stable_key: human-spaceflight
        name: "Human Spaceflight & Exploration"
        kind: sub_domain
        description: "Crewed vehicles, habitats, and deep-space missions"
        children:
          - stable_key: crewed-vehicles
            name: "Crewed Vehicles & Capsules"
            kind: area
          - stable_key: deep-space
            name: "Deep Space & Lunar/Mars Exploration"
            kind: area
      - stable_key: moon-based-activities
        name: "Moon Based Activities"
        kind: sub_domain
        description: "Infrastructure, operations, and resource utilization on the lunar surface"
        children:
          - stable_key: moon-base
