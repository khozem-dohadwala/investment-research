# Notes:
# - Top-level domains (kind: domain) appear directly at the highest navigation level.
# - The same lower-level concept (e.g. "AI Infrastructure") can be modeled as areas under different industries.
# - Entities like "NVIDIA" or "xAI" can belong to multiple top-level industries via MEMBER_OF.
# - Additional top-level industries can be added by extending this list.
# - User-created ad-hoc scopes get kind: "custom".